<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여성 옷 추천 - 데일리 룩</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-toggle">
    <button id="theme-btn" aria-label="Toggle Theme">🌙</button>
  </div>
  <div class="container">
    <header>
      <h1>오늘 뭐 입지?</h1>
      <p>날씨와 목적에 맞는 최적의 옷을 추천해드려요.</p>
    </header>

    <main>
      <section class="input-section">
        <div class="input-group">
          <label for="temp">현재 온도 (°C)</label>
          <input type="number" id="temp" placeholder="예: 18" value="20">
        </div>

        <div class="input-group">
          <label for="purpose">입는 목적</label>
          <select id="purpose">
            <option value="casual">캐주얼 (일상)</option>
            <option value="office">오피스룩 (출근)</option>
            <option value="date">데이트 (특별한 날)</option>
            <option value="exercise">운동/활동</option>
          </select>
        </div>

        <div class="input-group">
          <label>오늘의 날씨</label>
          <div class="weather-buttons">
            <button type="button" class="weather-btn active" data-weather="sunny">☀️ 맑음</button>
            <button type="button" class="weather-btn" data-weather="cloudy">☁️ 흐림</button>
            <button type="button" class="weather-btn" data-weather="rainy">☔ 비</button>
            <button type="button" class="weather-btn" data-weather="snowy">❄️ 눈</button>
          </div>
        </div>

        <button id="recommend-btn" class="primary-btn">추천 받기</button>
      </section>

      <section id="results" class="results-section">
        <div class="placeholder-text">정보를 입력하고 추천 버튼을 눌러주세요!</div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
